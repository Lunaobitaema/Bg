<!DOCTYPE html>
<html lang="bg" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Български — Монтажник</title>
<style>
:root {
  --bg: #ffffff;
  --bg2: #f4f6f8;
  --text: #1a1a1a;
  --text2: #555;
  --accent: #1B6CA8;
  --accent2: #145289;
  --border: #ddd;
  --card: #fff;
  --shadow: rgba(0,0,0,0.1);
  --overlay: rgba(0,0,0,0.5);
  --trans-bg: #e8f0fe;
  --trans-text: #1a3a6b;
  --gram-bg: #fff8e1;
  --gram-text: #5d4037;
  --tag-bg: #e3f2fd;
  --tag-text: #1565c0;
}
[data-theme="dark"] {
  --bg: #1a1a2e;
  --bg2: #16213e;
  --text: #e8e8f0;
  --text2: #aaa;
  --accent: #4a90d9;
  --accent2: #6aaef0;
  --border: #333;
  --card: #1e2a3a;
  --shadow: rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
  --trans-bg: #1a2d50;
  --trans-text: #90caf9;
  --gram-bg: #2d2000;
  --gram-text: #ffcc80;
  --tag-bg: #0d2137;
  --tag-text: #64b5f6;
}
[data-theme="sepia"] {
  --bg: #faf3e0;
  --bg2: #f0e6c8;
  --text: #3d2b1f;
  --text2: #6b4c35;
  --accent: #8b6542;
  --accent2: #6d4e32;
  --border: #c9b89a;
  --card: #fdf6e3;
  --shadow: rgba(80,50,20,0.15);
  --overlay: rgba(40,20,0,0.5);
  --trans-bg: #ede0c4;
  --trans-text: #4a2f18;
  --gram-bg: #f5ead0;
  --gram-text: #5c3d1e;
  --tag-bg: #e8d8b8;
  --tag-text: #6b4c35;
}
[data-theme="night"] {
  --bg: #0d1117;
  --bg2: #161b22;
  --text: #c9d1d9;
  --text2: #8b949e;
  --accent: #58a6ff;
  --accent2: #79c0ff;
  --border: #30363d;
  --card: #161b22;
  --shadow: rgba(0,0,0,0.6);
  --overlay: rgba(0,0,0,0.8);
  --trans-bg: #0c2448;
  --trans-text: #79c0ff;
  --gram-bg: #1c1600;
  --gram-text: #d4a843;
  --tag-bg: #0c1f35;
  --tag-text: #58a6ff;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 16px;
  line-height: 1.5;
}

/* HEADER */
.header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--accent);
  color: #fff;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 2px 8px var(--shadow);
}
.header h1 { font-size: 17px; font-weight: 700; letter-spacing: 0.3px; }
.header .subtitle { font-size: 11px; opacity: 0.85; margin-top: 1px; }
.theme-btn {
  background: rgba(255,255,255,0.2);
  border: none;
  color: #fff;
  border-radius: 20px;
  padding: 6px 14px;
  font-size: 13px;
  cursor: pointer;
  white-space: nowrap;
}

/* PAGE INDICATOR */
.page-info {
  text-align: center;
  padding: 10px 16px 4px;
  font-size: 13px;
  color: var(--text2);
  font-weight: 600;
}
.page-title {
  text-align: center;
  font-size: 18px;
  font-weight: 700;
  color: var(--accent);
  padding: 0 16px 12px;
}

/* PHRASES */
.phrases { padding: 0 12px 16px; }

.phrase-block {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  margin-bottom: 10px;
  overflow: hidden;
  box-shadow: 0 1px 4px var(--shadow);
}

.phrase-bg {
  padding: 12px 14px 8px;
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.5;
  cursor: default;
}

.phrase-bg .word {
  cursor: pointer;
  color: var(--accent);
  border-bottom: 1px dashed var(--accent);
  display: inline;
}

.gram-note {
  padding: 6px 14px 8px;
  font-size: 12px;
  color: var(--gram-text);
  background: var(--gram-bg);
  border-top: 1px solid var(--border);
  line-height: 1.4;
}

.trans-toggle {
  display: flex;
  align-items: center;
  padding: 8px 14px;
  background: var(--bg2);
  border-top: 1px solid var(--border);
  cursor: pointer;
  user-select: none;
}
.trans-toggle span {
  font-size: 12px;
  color: var(--text2);
  flex: 1;
}
.trans-toggle .arrow {
  font-size: 11px;
  color: var(--accent);
  transition: transform 0.2s;
}
.trans-toggle.open .arrow { transform: rotate(180deg); }

.trans-body {
  display: none;
  padding: 8px 14px 10px;
  font-size: 14px;
  color: var(--trans-text);
  background: var(--trans-bg);
  line-height: 1.4;
}
.trans-body.open { display: block; }

/* NAVIGATION */
.nav {
  position: sticky;
  bottom: 0;
  background: var(--bg);
  border-top: 1px solid var(--border);
  padding: 10px 16px 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  box-shadow: 0 -2px 8px var(--shadow);
}

.nav-btn {
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 8px 16px;
  font-size: 18px;
  cursor: pointer;
  min-width: 44px;
  line-height: 1;
}
.nav-btn:disabled { background: var(--border); cursor: default; }

.page-dots {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  justify-content: center;
  max-width: 220px;
}
.dot {
  width: 28px;
  height: 28px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--bg2);
  color: var(--text);
  font-size: 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 600;
}
.dot.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}

/* WORD POPUP */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: var(--overlay);
  z-index: 200;
}
.overlay.open { display: block; }

.popup {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--card);
  border-radius: 20px 20px 0 0;
  padding: 20px 20px 30px;
  z-index: 201;
  max-height: 80vh;
  overflow-y: auto;
  transform: translateY(100%);
  transition: transform 0.3s ease;
}
.popup.open { transform: translateY(0); }

.popup-handle {
  width: 40px;
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin: 0 auto 16px;
}

.popup-word {
  font-size: 26px;
  font-weight: 800;
  color: var(--accent);
  margin-bottom: 4px;
}
.popup-ru {
  font-size: 16px;
  color: var(--text2);
  margin-bottom: 12px;
}
.popup-tags {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}
.tag {
  background: var(--tag-bg);
  color: var(--tag-text);
  border-radius: 20px;
  padding: 3px 10px;
  font-size: 12px;
  font-weight: 600;
}
.popup-section {
  margin-bottom: 14px;
}
.popup-section h3 {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--text2);
  margin-bottom: 6px;
}
.popup-section p {
  font-size: 14px;
  color: var(--text);
  line-height: 1.6;
}
.conj-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.conj-table td {
  padding: 4px 8px;
  border-bottom: 1px solid var(--border);
  color: var(--text);
}
.conj-table td:first-child { color: var(--text2); width: 40%; }
.popup-close {
  position: absolute;
  top: 16px;
  right: 16px;
  background: var(--bg2);
  border: none;
  color: var(--text2);
  border-radius: 50%;
  width: 32px;
  height: 32px;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="h1">🇧🇬 Български</div>
    <div class="subtitle">Фрази за монтажници</div>
  </div>
  <button class="theme-btn" onclick="cycleTheme()">◑ Тема</button>
</div>

<div id="page-info" class="page-info"></div>
<div id="page-title" class="page-title"></div>
<div id="phrases" class="phrases"></div>

<div class="nav">
  <button class="nav-btn" id="prev-btn" onclick="changePage(-1)">‹</button>
  <div class="page-dots" id="dots"></div>
  <button class="nav-btn" id="next-btn" onclick="changePage(1)">›</button>
</div>

<div class="overlay" id="overlay" onclick="closePopup()"></div>
<div class="popup" id="popup">
  <button class="popup-close" onclick="closePopup()">×</button>
  <div class="popup-handle"></div>
  <div class="popup-word" id="popup-word"></div>
  <div class="popup-ru" id="popup-ru"></div>
  <div class="popup-tags" id="popup-tags"></div>
  <div id="popup-body"></div>
</div>

<script>
const THEMES = ['light','dark','sepia','night'];
let themeIdx = 0;

function cycleTheme() {
  themeIdx = (themeIdx + 1) % THEMES.length;
  document.documentElement.setAttribute('data-theme', THEMES[themeIdx]);
  try { localStorage.setItem('bg-theme', themeIdx); } catch(e){}
}
try {
  const s = localStorage.getItem('bg-theme');
  if (s !== null) { themeIdx = +s; document.documentElement.setAttribute('data-theme', THEMES[themeIdx]); }
} catch(e){}

// WORD DICTIONARY
const WORDS = {
  "аз": {
    ru: "я",
    tags: ["местоимение", "1 л. ед.ч."],
    grammar: "Личното местоимение за 1 лице единствено число. В разговорна реч часто се пропуска, тъй като лицето се разбира от глаголното окончание.",
    forms: [["аз","я"],["ти","ты"],["той/тя/то","он/она/оно"],["ние","мы"],["вие","вы"],["те","они"]]
  },
  "съм": {
    ru: "я есть / быть",
    tags: ["глагол", "спрежение"],
    grammar: "Глаголът 'съм' (быть) е нередовен. В сегашно време: аз съм, ти си, той е, ние сме, вие сте, те са. Отрицание: не съм, не си, не е...",
    forms: [["аз съм","я есть"],["ти си","ты есть"],["той/тя е","он/она есть"],["ние сме","мы есть"],["вие сте","вы есть"],["те са","они есть"],["аз не съм","я не есть"]]
  },
  "казвам": {
    ru: "называть, говорить",
    tags: ["глагол", "несв. вид"],
    grammar: "Казвам се = меня зовут (дословно: называюсь). Спряжение: казвам, казваш, казва, казваме, казвате, казват.",
    forms: [["казвам се","я называюсь"],["казваш се","ты называешься"],["казва се","он/а называется"],["казваме се","мы называемся"]]
  },
  "работя": {
    ru: "работаю",
    tags: ["глагол", "1 л. ед.ч."],
    grammar: "Работя — сегашно време, 1 лице. Спряжение: работя, работиш, работи, работим, работите, работят. Място на работа: в + [название].",
    forms: [["работя","работаю"],["работиш","работаешь"],["работи","работает"],["работим","работаем"],["работят","работают"]]
  },
  "агенция": {
    ru: "агентство",
    tags: ["съществително", "жен. род"],
    grammar: "Женски род. С определителен член (артикъл): агенцията (агентство). Рекламна агенция = рекламное агентство.",
    forms: [["агенция","агентство (без арт.)"],["агенцията","агентство (с арт.)"]]
  },
  "монтажник": {
    ru: "монтажник",
    tags: ["съществително", "муж. род"],
    grammar: "Мъжки род. С определителен член: монтажникът (монтажник). Монтажна работа = монтажная работа.",
    forms: [["монтажник","монтажник"],["монтажникът","монтажник (с арт.)"]]
  },
  "трябва": {
    ru: "нужно, надо, должен",
    tags: ["модален глагол"],
    grammar: "Трябва е безличен модален глагол. Конструкция: трябва + да + глагол в сег. вр. Пример: Трябва да работим = Нам нужно работать. Не се спряга по лице!",
    forms: [["трябва да работя","мне нужно работать"],["трябва да тръгваме","нам нужно идти"],["не трябва","не нужно, нельзя"]]
  },
  "утре": {
    ru: "завтра",
    tags: ["наречие", "время"],
    grammar: "Наречие за бъдещо време. Днес = сегодня, утре = завтра, вдругиден = послезавтра, вчера = вчера.",
    forms: [["вчера","вчера"],["днес","сегодня"],["утре","завтра"],["вдругиден","послезавтра"]]
  },
  "идва": {
    ru: "приходит, едет",
    tags: ["глагол", "3 л. ед.ч."],
    grammar: "Идвам (приходить). Спряжение: идвам, идваш, идва, идваме, идвате, идват. Отида = пойти (св. вид).",
    forms: [["идвам","прихожу"],["идваш","приходишь"],["идва","приходит"],["идваме","приходим"],["идват","приходят"]]
  },
  "шефът": {
    ru: "начальник, шеф",
    tags: ["съществително", "муж. род", "с артикул"],
    grammar: "Мъжки род, с определителен член -ът. Шеф (без арт.) → шефът (с арт.). В разговорна реч: шефа (кратка форма на арт.: -а).",
    forms: [["шеф","шеф (без арт.)"],["шефът / шефа","шеф (с арт.)"],["на шефа","шефа (род. пад.)"]]
  },
  "закъснявам": {
    ru: "опаздываю",
    tags: ["глагол", "несв. вид"],
    grammar: "Закъснявам = опаздываю. Закъсних = опоздал (минало свърш. вр. — аорист). Защо закъсня? = Почему опоздал?",
    forms: [["закъснявам","опаздываю"],["закъсних","опоздал"],["ще закъснея","опоздаю"]]
  },
  "тръгваме": {
    ru: "отправляемся, выходим",
    tags: ["глагол", "1 л. мн.ч."],
    grammar: "Тръгвам (отправляться). Тръгваме = мы отправляемся. Тръгни! = Выходи! (повелит. накл.). Хайде да тръгваме = Давай выходим.",
    forms: [["тръгвам","отправляюсь"],["тръгваме","отправляемся"],["тръгни!","выходи! (ед.ч.)"],["тръгнете!","выходите! (мн.ч.)"]]
  },
  "фургона": {
    ru: "фургон (с артиклем)",
    tags: ["съществително", "муж. род"],
    grammar: "Фургон → фургонът (пълен артикъл), фургона (кратък артикъл след глагол). Разтовари фургона = Разгрузи фургон.",
    forms: [["фургон","фургон"],["фургонът","фургон (с арт.)"]]
  },
  "натоварваме": {
    ru: "загружаем",
    tags: ["глагол", "1 л. мн.ч."],
    grammar: "Натоварвам (загружать). Натоварваме = мы загружаем. Разтоварвам = разгружать. Товарен автомобил = грузовик.",
    forms: [["натоварвам","загружаю"],["натоварваме","загружаем"],["разтоварваме","разгружаем"]]
  },
  "чука": {
    ru: "молоток (с артиклем)",
    tags: ["съществително", "муж. род"],
    grammar: "Чук → чукът (с пълен арт.), чука (кратък арт.). Дай ми чука = Дай мне молоток. Чукам = стучать/забивать.",
    forms: [["чук","молоток"],["чукът / чука","молоток (с арт.)"]]
  },
  "имам": {
    ru: "имею, у меня есть",
    tags: ["глагол", "1 л. ед.ч."],
    grammar: "Имам/нямам = есть/нет (у меня). Конструкция: имам + съществително. Имаш ли? = У тебя есть? Нямам = не имею.",
    forms: [["имам","у меня есть"],["нямам","у меня нет"],["имаш","у тебя есть"],["нямаш","у тебя нет"],["има","есть"],["няма","нет (чего-то)"]]
  },
  "бормашината": {
    ru: "дрель (с артиклем)",
    tags: ["съществително", "жен. род"],
    grammar: "Бормашина (жен. род) → бормашината (с арт. -та). Акумулаторна бормашина = аккумуляторная дрель. Батерията = аккумулятор.",
    forms: [["бормашина","дрель"],["бормашината","дрель (с арт.)"]]
  },
  "шурупа": {
    ru: "шуруп (с артиклем)",
    tags: ["съществително", "муж. род"],
    grammar: "Шуруп = шуруп. Дюбел = дюбель. Болт = болт. Гайка = гайка. Пирон = гвоздь. Всички са от мъжки род.",
    forms: [["шуруп","шуруп"],["дюбел","дюбель"],["болт","болт"],["пирон","гвоздь"]]
  },
  "нивото": {
    ru: "уровень (с артиклем)",
    tags: ["съществително", "ср. род"],
    grammar: "Ниво (ср. род) → нивото (с арт. -то). Провери с нивото = Проверь уровнем. Хоризонтален = горизонтальный.",
    forms: [["ниво","уровень"],["нивото","уровень (с арт.)"]]
  },
  "внимавай": {
    ru: "осторожно! смотри!",
    tags: ["глагол", "повелит."],
    grammar: "Внимавай! = Осторожно! / Будь внимателен! Внимавайте! (мн.ч.). Внимание! = Внимание! Бъди внимателен = Будь осторожен.",
    forms: [["внимавай!","осторожно! (ед.ч.)"],["внимавайте!","осторожно! (мн.ч.)"],["внимание!","внимание!"]]
  },
  "кабелите": {
    ru: "кабели (с артиклем)",
    tags: ["съществително", "мн.ч."],
    grammar: "Кабел → кабелите (мн.ч. с арт. -те). Електрически кабел = электрический кабель. Не докосвай = Не трогай.",
    forms: [["кабел","кабель"],["кабелите","кабели (с арт.)"]]
  },
  "какво": {
    ru: "что",
    tags: ["местоимение", "вопросит."],
    grammar: "Какво = что. Какво правиш? = Что делаешь? Какво стана? = Что случилось? Какво има? = Что есть? / В чём дело?",
    forms: [["какво?","что?"],["какво правиш?","что делаешь?"],["за какво?","зачем? о чём?"]]
  },
  "правим": {
    ru: "делаем",
    tags: ["глагол", "1 л. мн.ч."],
    grammar: "Правя (делать). Правим = мы делаем. Направихме = мы сделали (аорист). Направи! = Сделай! (повелит.).",
    forms: [["правя","делаю"],["правиш","делаешь"],["прави","делает"],["правим","делаем"],["правят","делают"],["направи!","сделай!"]]
  },
  "колко": {
    ru: "сколько",
    tags: ["наречие", "вопросит."],
    grammar: "Колко = сколько. Колко струва? = Сколько стоит? Колко тежи? = Сколько весит? Колко е широко? = Сколько в ширину?",
    forms: [["колко?","сколько?"],["колко струва?","сколько стоит?"],["колко тежи?","сколько весит?"]]
  },
  "монтира": {

    { bg: "Аз ще взема кашкавал панирован.", ru: "Я возьму жареный сыр.", gram: "Ще взема = возьму. Кашкавал панирован = жареный сыр в панировке.", words: ["Аз","ще"] },
    { bg: "Вода или сок?", ru: "Воду или сок?", gram: "Вода = вода. Сок = сок. Или = или. Простой вопрос о выборе напитка.", words: [] },
    { bg: "Вода, благодаря. Горещо е.", ru: "Воду, спасибо. Жарко.", gram: "Горещо е = жарко (буквально: горячо есть). Студено е = холодно.", words: [] },
    { bg: "Приятен апетит!", ru: "Приятного аппетита!", gram: "Приятен апетит = приятного аппетита. Наздраве = на здоровье (тост).", words: [] },

    { bg: "Три обекта за пет дни.", ru: "Три объекта за пять дней.", gram: "Три обекта = три объекта (числ. + им. пад.). За пет дни = за пять дней.", words: [] },

];

// ---- RENDER ----
let currentPage = 0;
try { const s = localStorage.getItem('bg-page'); if(s!==null) currentPage = Math.min(+s, PAGES.length-1); } catch(e){}

function renderPage() {
  const page = PAGES[currentPage];
  document.getElementById('page-info').textContent = `Страница ${currentPage+1} от ${PAGES.length}`;
  document.getElementById('page-title').textContent = page.title;
  
  const container = document.getElementById('phrases');
  container.innerHTML = '';
  
  page.phrases.forEach((p, i) => {
    const block = document.createElement('div');
    block.className = 'phrase-block';
    
    // Build clickable Bulgarian text
    let bgHtml = p.bg;
    // Replace each word that has an entry in WORDS
    const tokens = p.bg.split(/(\s+)/);
    let htmlTokens = tokens.map(tok => {
      const clean = tok.replace(/[.,!?:;()]/g, '');
      const key = Object.keys(WORDS).find(k => k.toLowerCase() === clean.toLowerCase());
      if (key) {
        return tok.replace(clean, `<span class="word" onclick="showWord('${key}')">${clean}</span>`);
      }
      return tok;
    });
    bgHtml = htmlTokens.join('');
    
    block.innerHTML = `
      <div class="phrase-bg">${bgHtml}</div>
      <div class="gram-note">📝 ${p.gram}</div>
      <div class="trans-toggle" onclick="toggleTrans(this)">
        <span>🇷🇺 Перевод</span>
        <span class="arrow">▼</span>
      </div>
      <div class="trans-body">${p.ru}</div>
    `;
    container.appendChild(block);
  });
  
  // Update nav dots
  const dotsEl = document.getElementById('dots');
  dotsEl.innerHTML = '';
  PAGES.forEach((_, i) => {
    const dot = document.createElement('div');
    dot.className = 'dot' + (i === currentPage ? ' active' : '');
    dot.textContent = i + 1;
    dot.onclick = () => goToPage(i);
    dotsEl.appendChild(dot);
  });
  
  document.getElementById('prev-btn').disabled = currentPage === 0;
  document.getElementById('next-btn').disabled = currentPage === PAGES.length - 1;
  
  try { localStorage.setItem('bg-page', currentPage); } catch(e){}
  window.scrollTo(0, 0);
}

function toggleTrans(el) {
  el.classList.toggle('open');
  el.nextElementSibling.classList.toggle('open');
}

function changePage(dir) {
  const next = currentPage + dir;
  if (next >= 0 && next < PAGES.length) {
    currentPage = next;
    renderPage();
  }
}

function goToPage(i) {
  currentPage = i;
  renderPage();
}

function showWord(key) {
  const w = WORDS[key];
  if (!w) return;
  
  document.getElementById('popup-word').textContent = key;
  document.getElementById('popup-ru').textContent = w.ru;
  
  const tagsEl = document.getElementById('popup-tags');
  tagsEl.innerHTML = (w.tags || []).map(t => `<span class="tag">${t}</span>`).join('');
  
  let body = '';
  if (w.grammar) {
    body += `<div class="popup-section"><h3>Граматика</h3><p>${w.grammar}</p></div>`;
  }
  if (w.forms && w.forms.length) {
    body += `<div class="popup-section"><h3>Форми / Спрежение</h3><table class="conj-table">`;
    w.forms.forEach(([bg, ru]) => {
      body += `<tr><td>${bg}</td><td>${ru}</td></tr>`;
    });
    body += `</table></div>`;
  }
  document.getElementById('popup-body').innerHTML = body;
  
  document.getElementById('overlay').classList.add('open');
  document.getElementById('popup').classList.add('open');
}

function closePopup() {
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('popup').classList.remove('open');
}

// Swipe support
let touchStartX = 0;
document.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, {passive:true});
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 60 && !document.getElementById('popup').classList.contains('open')) {
    if (dx < 0) changePage(1);
    else changePage(-1);
  }
}, {passive:true});

renderPage();
</script>
